<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d5dfc"><title>Quản trị | Confessions Ngã Sáu</title>
  <link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="./styles.css"><script defer src="./app.js"></script>
</head>
<body data-page="admin" class="min-h-screen bg-slate-50 text-slate-800">
  <header class="border-b border-slate-100 bg-white"><div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6">
    <div><a href="./index.html" class="text-xs font-bold text-brand-600">← Bảng tin</a><h1 class="mt-1 text-xl font-black sm:text-2xl">Trung tâm quản trị</h1></div>
    <button id="adminLogout" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-bold hover:bg-slate-50">Đăng xuất</button>
  </div></header>
  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3"><div><p class="text-xs font-extrabold uppercase tracking-[.18em] text-brand-600">Kiểm duyệt nội dung</p><h2 class="mt-1 text-2xl font-black">Bài viết đang chờ</h2><p class="mt-1 text-sm text-slate-500">Thông tin người gửi chỉ hiển thị trong khu vực quản trị.</p></div><button id="reloadPending" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold hover:bg-slate-50">↻ Tải lại</button></div>
    <div class="mb-4 flex items-center justify-between rounded-2xl border border-slate-100 bg-white px-4 py-3"><label class="flex items-center gap-3 text-sm font-bold"><input id="selectAll" type="checkbox" class="h-4 w-4 accent-brand-600"> Chọn tất cả</label><span id="pendingCount" class="text-xs font-semibold text-slate-500">0 bài chờ duyệt</span></div>
    <div id="pendingList" class="space-y-4"><div class="skeleton h-36 rounded-2xl"></div></div>
  </main>
  <div id="bulkBar" class="fixed inset-x-0 bottom-0 z-30 border-t border-slate-200 bg-white/95 p-4 shadow-2xl backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-3"><span id="selectedLabel" class="text-sm font-bold text-slate-600">Đã chọn 0 bài</span><button id="approveSelected" disabled class="rounded-xl bg-emerald-600 px-5 py-3 text-sm font-extrabold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-40">Duyệt (0) bài đã chọn</button></div>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
